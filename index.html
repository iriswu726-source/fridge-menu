<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冰箱週菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Patrick+Hand&display=swap">
<style>
:root{
  --paper:#F7F3E8;--dot:#D6CDB8;--sheet:#FFFDF7;--sheet-2:#F4EEDF;
  --ink:#2B3552;--muted:#6B6F84;--line:#D9CFBA;--rule:#E7DFCC;
  --tape-y:#F2D98A;--tape-p:#F1C6C2;--tape-g:#BCD4B1;--tape-b:#B9D5E4;
  --red:#C24A35;--green:#3F7F50;--amber:#9A6A12;
  --hl-good:#C6E3B8;--hl-ok:#F7E29A;--hl-bad:#F6BDB1;
  --shadow:rgba(43,53,82,.10);
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi","PingFang TC",serif;
  --num:"Patrick Hand","LXGW WenKai TC","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1C1F2C;--dot:#323749;--sheet:#242838;--sheet-2:#2B3042;
    --ink:#ECE5D4;--muted:#A8A7B6;--line:#3B4056;--rule:#30354A;
    --tape-y:#7A6831;--tape-p:#7A4F57;--tape-g:#4F6B53;--tape-b:#42606F;
    --red:#F08A73;--green:#8FCB98;--amber:#E6B45E;
    --hl-good:#3D5E45;--hl-ok:#6A5827;--hl-bad:#733F38;
    --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1C1F2C;--dot:#323749;--sheet:#242838;--sheet-2:#2B3042;
  --ink:#ECE5D4;--muted:#A8A7B6;--line:#3B4056;--rule:#30354A;
  --tape-y:#7A6831;--tape-p:#7A4F57;--tape-g:#4F6B53;--tape-b:#42606F;
  --red:#F08A73;--green:#8FCB98;--amber:#E6B45E;
  --hl-good:#3D5E45;--hl-ok:#6A5827;--hl-bad:#733F38;
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--hand);font-size:15px;line-height:1.6;
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:20px 20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.02em}

.wrap{max-width:1380px;margin:0 auto;padding-inline:20px;padding-block:30px 56px}
@media (max-width:520px){.wrap{padding-inline:16px;padding-block:20px 40px}}

/* 封面 */
.cover{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.cover h1{font-weight:700;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0;letter-spacing:.04em;display:inline;
  background:linear-gradient(transparent 62%,var(--tape-y) 62%,var(--tape-y) 92%,transparent 92%);padding-inline:4px}
.lede{margin:10px 0 0;color:var(--muted);max-width:60ch}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--red);color:var(--red);
  border-radius:8px;padding:4px 12px;transform:rotate(-4deg);font-family:var(--num);line-height:1.1;margin-left:14px;vertical-align:10px}
.stamp b{font-size:20px;font-weight:400}.stamp small{font-size:13px}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:6px 14px;box-shadow:2px 2px 0 var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--tape-y);font-weight:700}
.btn.small{padding:2px 10px;font-size:13.5px;box-shadow:1.5px 1.5px 0 var(--ink)}
.btn.danger{color:var(--red);border-color:var(--red);box-shadow:1.5px 1.5px 0 var(--red)}

/* 模式索引標籤 */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;border-bottom:1.5px solid var(--ink);margin-bottom:0}
.mode{position:relative;text-align:left;border:1.5px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 14px 8px;
  background:var(--tab);opacity:.78;display:flex;flex-direction:column;gap:0;min-width:0}
.mode:hover{opacity:1}
.mode[aria-selected="true"]{opacity:1;padding-top:16px;margin-bottom:-1.5px;padding-bottom:10px;background:var(--tab)}
.mode .mn{font-size:22px;font-weight:700;line-height:1.15}
.mode .ms{font-size:13px;color:var(--ink);opacity:.8}
.mode .mk{font-family:var(--num);font-size:15px}
.mode[data-goal="cut"]{--tab:var(--tape-b)}
.mode[data-goal="keep"]{--tab:var(--tape-g)}
.mode[data-goal="gain"]{--tab:var(--tape-p)}
@media (max-width:560px){.mode .ms{display:none}.mode .mn{font-size:19px}}
.memo{background:var(--sheet);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;padding:14px 18px 16px;margin-bottom:26px;
  display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 28px;
  background-image:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);background-position:0 12px}
@media (max-width:860px){.memo{grid-template-columns:minmax(0,1fr)}}
.memo h3{margin:0 0 2px;font-size:16px}
.memo ul{margin:0;padding-left:1.2em;line-height:28px}
.memo li::marker{content:"✓  ";color:var(--green)}
.recs{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.rec{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:14px;line-height:1.6}
.rec .n{color:var(--muted);font-size:13px;margin-left:4px}

.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:24px;min-width:0}
.main{display:flex;flex-direction:column;gap:26px;min-width:0}

.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:20px 16px 16px;box-shadow:2px 3px 0 var(--shadow)}
.taped::before{content:"";position:absolute;top:-11px;left:50%;width:96px;height:22px;transform:translateX(-50%) rotate(-2.5deg);
  background:var(--tape,var(--tape-y));opacity:.9;
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%)}
.sheet h2{font-size:19px;margin:0 0 12px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.label{font-size:13px;color:var(--muted);letter-spacing:.06em}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.add input,.add select,.qty{background:transparent;border:0;border-bottom:1.5px dashed var(--line);border-radius:0;padding:3px 2px;min-width:0;width:100%}
.field input:focus,.add input:focus,.qty:focus{border-bottom-color:var(--ink);outline:none}
.check{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px;accent-color:var(--green)}
.targets{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted);line-height:1.75}
.targets b{color:var(--ink);font-weight:400;font-family:var(--num);font-size:16px}

.add{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:8px;align-items:end}
.add .row2{grid-column:1/-1;display:flex;gap:8px;align-items:center;min-height:24px}
.add .row2 select{flex:1}
.hint{font-size:13px;color:var(--muted)}
.note{font-size:14px;background:var(--tape-y);border-radius:2px;padding:8px 12px;margin:12px 0 0;transform:rotate(-.6deg);box-shadow:1px 2px 0 var(--shadow)}
.inv{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.inv-cat .label{display:block;border-bottom:1px solid var(--rule);margin-bottom:2px}
.inv-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 28px auto auto;gap:6px;align-items:center;min-height:30px}
.inv-row .nm{overflow-wrap:anywhere}
.inv-row .u{font-size:13px;color:var(--muted)}
.qty{text-align:right;font-family:var(--num);font-size:16px}
.icon-btn{border:1px solid transparent;background:none;border-radius:4px;padding:0 6px;font-size:13px;color:var(--muted)}
.icon-btn:hover{border-color:var(--line)}
.prio-btn[aria-pressed="true"]{color:var(--ink);background:linear-gradient(transparent 40%,var(--tape-y) 40%);font-weight:700}
.inv-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* 摘要 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:10px 14px;box-shadow:2px 3px 0 var(--shadow);display:flex;flex-direction:column}
.tile:nth-child(odd){transform:rotate(-.5deg)}.tile:nth-child(even){transform:rotate(.4deg)}
.tile .v{font-family:var(--num);font-size:30px;line-height:1.15}
.tile .v small{font-size:16px;color:var(--muted)}
.tile .l{font-size:13.5px;color:var(--muted)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:26px;font-weight:700;display:inline;background:linear-gradient(transparent 60%,var(--tab-c,var(--tape-g)) 60%,var(--tab-c,var(--tape-g)) 90%,transparent 90%);padding-inline:3px}
.sec-head .aside{font-size:14px;color:var(--muted)}

.scroll{overflow-x:auto;background:var(--sheet);border:1px solid var(--line);border-radius:3px;box-shadow:2px 3px 0 var(--shadow)}
table.heat{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
.heat th,.heat td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--rule);white-space:nowrap}
.heat tr:last-child td,.heat tr:last-child th{border-bottom:0}
.heat thead th{font-weight:400;color:var(--muted);font-size:13.5px;border-bottom:1.5px solid var(--ink)}
.heat thead th .n{font-size:16px;color:var(--ink)}
.heat th[scope="row"]{text-align:left;font-weight:700}
.heat th[scope="row"] small{color:var(--muted);font-weight:400;margin-left:4px;font-size:12.5px}
.heat td.tg{color:var(--muted);font-family:var(--num);font-size:15px}
.heat td.c{font-family:var(--num);font-size:16px}
.heat td.avg{border-left:1.5px dashed var(--line);font-weight:700}
.hl{padding:0 5px;background:linear-gradient(transparent 38%,var(--hl) 38%,var(--hl) 88%,transparent 88%)}
.s-good{--hl:var(--hl-good)}.s-ok{--hl:var(--hl-ok)}.s-low,.s-high{--hl:var(--hl-bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

/* 週計畫 */
.board{display:flex;flex-direction:column;gap:18px}
.day{position:relative;display:grid;grid-template-columns:74px repeat(3,minmax(0,1fr)) 230px;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:2px 3px 0 var(--shadow)}
.day:nth-child(4n+1){--tape:var(--tape-y)}.day:nth-child(4n+2){--tape:var(--tape-b)}.day:nth-child(4n+3){--tape:var(--tape-p)}.day:nth-child(4n){--tape:var(--tape-g)}
.day::before{left:52px}
@media (max-width:1280px){
  .day{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dayhead{grid-column:1/-1;flex-direction:row!important;gap:12px!important;justify-content:flex-start!important}
  .dayside{grid-column:1/-1}
}
@media (max-width:680px){.day{grid-template-columns:minmax(0,1fr)}}
.dayhead{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.datecirc{width:62px;height:62px;border:1.5px solid var(--ink);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datecirc .mo{font-family:var(--num);font-size:13px;color:var(--muted)}
.datecirc .dd{font-family:var(--num);font-size:28px}
.dayhead .wd{font-size:16px;font-weight:700}
.dayhead .today{font-size:12.5px;color:var(--red);border:1.5px solid var(--red);border-radius:3px;padding:0 5px;transform:rotate(-4deg)}

.meal{display:flex;flex-direction:column;gap:6px;min-width:0;padding:4px 12px 8px;border-left:1.5px dashed var(--line)}
@media (max-width:1280px){.meal:nth-child(2){border-left:0;padding-left:0}}
@media (max-width:680px){.meal{border-left:0;padding-left:0;border-top:1.5px dashed var(--line);padding-top:10px}.meal:nth-child(2){border-top:0;padding-top:4px}}
.meal.overridden .dish{background:linear-gradient(transparent 60%,var(--tape-y) 60%)}
.meal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mtag{font-size:13px;padding:0 8px;background:var(--mt);border-radius:2px}
.meal[data-m="B"]{--mt:var(--tape-y)}.meal[data-m="L"]{--mt:var(--tape-g)}.meal[data-m="D"]{--mt:var(--tape-b)}
.meal-top .kc{font-family:var(--num);font-size:14px;color:var(--muted)}
.dish{font-size:21px;font-weight:700;line-height:1.25;background:none;border:0;padding:0;text-align:left;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;align-self:flex-start}
.dish .caret{font-size:13px;color:var(--muted);font-weight:400;white-space:nowrap;border-bottom:1px dashed var(--muted)}
.dish:hover .caret{color:var(--ink)}
.parts{color:var(--muted);font-size:13.5px;margin-top:-4px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--green);color:var(--green);border-radius:999px;padding:0 7px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
.chip{font-size:13.5px;line-height:1.5;white-space:nowrap}
.chip .n{font-size:15px;color:var(--muted)}
.chip::after{content:"・";color:var(--line);margin-left:6px}
.chip:last-child::after{content:""}
.chip.pantry{color:var(--muted)}
.chip.prio{background:linear-gradient(transparent 45%,var(--tape-y) 45%)}
.chip.part,.chip.miss{color:var(--red)}
.chip.part .n,.chip.miss .n{color:var(--red)}
.chip .x{display:inline-block;border:1.2px solid var(--red);border-radius:50%;width:18px;height:18px;line-height:15px;text-align:center;font-size:11.5px;margin-left:2px;vertical-align:1px}
.alts{display:flex;flex-direction:column;gap:0;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.alts .t{font-size:12.5px;color:var(--muted)}
.alt{display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-bottom:1px solid var(--rule);padding:3px 2px;text-align:left}
.alt:hover{background:var(--sheet-2)}
.alt .pct{font-family:var(--num);font-size:15px;color:var(--muted);white-space:nowrap}
.alt .tg2{font-size:11.5px;color:var(--green);margin-left:6px}

.dayside{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0;background:var(--sheet-2);border-radius:3px;padding:10px 12px;
  background-image:repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px)}
.dayside .blk{display:flex;flex-direction:column;gap:3px}
.dayside .tot{font-family:var(--num);font-size:24px;line-height:1.1}
.dayside .tot small{font-size:15px;color:var(--muted)}
.macro{display:flex;height:9px;border:1px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--sheet)}
.macro span{display:block;height:100%}
.macro .mp{background:var(--tape-p)}.macro .mf{background:var(--tape-y)}.macro .mc{background:var(--tape-g)}
.mlegend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.mlegend i{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:4px}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12.5px;padding:0 6px;border:1.5px solid var(--red);color:var(--red);border-radius:3px;transform:rotate(-1.5deg)}
.flag.ok{border-color:var(--green);color:var(--green);transform:rotate(1deg)}

.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:760px){.lists{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;line-height:30px;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.list li::before{content:"□";margin-right:8px;color:var(--muted)}
.list li>span:first-child{flex:1}
.list .amt{font-family:var(--num);font-size:16px;color:var(--muted);white-space:nowrap}
.list .star{font-size:12.5px;margin-left:6px;color:var(--amber)}
.empty{color:var(--muted);font-size:14px;margin:0}
textarea.copybox{width:100%;min-height:120px;margin-top:8px;background:var(--sheet-2);border:1px solid var(--line);border-radius:3px;padding:8px;font-family:var(--hand);font-size:14px;color:var(--ink)}
.foot{font-size:13.5px;color:var(--muted);max-width:90ch;margin:0;line-height:1.75}
@media (prefers-reduced-motion:reduce){.btn:hover,.btn:active{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div>
      <h1>冰箱週菜單</h1><span class="stamp" id="stamp"></span>
      <p class="lede">寫下冰箱裡有什麼，選一個目標，自動排好 7 天早、午、晚餐與加餐，份量依你的熱量調整，並對照每日營養建議檢查缺口。</p>
    </div>
    <button id="reroll" class="btn primary" type="button">重新排菜單</button>
  </header>

  <div class="modes" role="tablist" aria-label="飲食目標" id="modes"></div>
  <section class="memo" id="memo" role="tabpanel"></section>

  <div class="layout">
    <aside class="side">
      <section class="sheet taped" style="--tape:var(--tape-b)" aria-labelledby="set-h">
        <h2 id="set-h">個人設定 <span class="label">19–50 歲</span></h2>
        <div class="form-grid">
          <div class="field"><label for="sex">性別</label>
            <select id="sex"><option value="f">女性</option><option value="m">男性</option></select></div>
          <div class="field"><label for="weight">體重（kg）</label>
            <input id="weight" type="number" min="30" max="150" step="1" inputmode="numeric"></div>
          <div class="field"><label for="act">活動量</label>
            <select id="act">
              <option value="25">久坐少動</option><option value="30">輕度活動</option>
              <option value="35">中度活動</option><option value="40">重度活動</option>
            </select></div>
          <div class="field"><label for="people">用餐人數</label>
            <input id="people" type="number" min="1" max="10" step="1" inputmode="numeric"></div>
          <label class="check" for="staples"><input id="staples" type="checkbox"> 白米、麵條、燕麥視為常備乾貨（不必列在冰箱裡）</label>
        </div>
        <div class="targets" id="targets"></div>
      </section>

      <section class="sheet taped" style="--tape:var(--tape-p)" aria-labelledby="fr-h">
        <h2 id="fr-h">冰箱現有食材 <span class="label" id="inv-count"></span></h2>
        <form class="add" id="addForm" autocomplete="off">
          <input id="addName" list="ingList" placeholder="食材，例如：雞蛋" aria-label="食材名稱">
          <input id="addQty" type="number" min="0" step="any" placeholder="數量" aria-label="數量" inputmode="decimal">
          <button class="btn small" type="submit">加入</button>
          <div class="row2" id="addMeta"><span class="hint">單位會依食材自動帶入</span></div>
        </form>
        <datalist id="ingList"></datalist>
        <div id="sampleNote"></div>
        <div class="inv" id="inv"></div>
        <div class="inv-actions">
          <button class="btn small" type="button" id="loadSample">載入範例食材</button>

function add(a,b){for(const n in a)a[n]+=b[n];return a}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function roundAmt(key,g,step){
  const i=ING[key];step=step||5;
  if(i.u==="g"||i.u==="ml")return Math.max(step,Math.round(g/step)*step);
  const us=i.cat==="fruit"?.5:1;
  return Math.max(us,Math.round(g/i.gpu/us)*us)*i.gpu;
}
function fmtAmt(key,g){
  const i=ING[key];
  if(i.u==="g"||i.u==="ml")return `<span class="n">${Math.round(g)}</span> ${i.u}`;

  return `<span class="n">${n%1?n.toFixed(1):n}</span> ${i.u}`;
}
function fmtBuy(key,g){
  const i=ING[key];
  if(i.u==="g"||i.u==="ml")return Math.ceil(g/50)*50+" "+i.u;
  return Math.ceil(g/i.gpu-0.01)+" "+i.u;
}
function maintK(){return Math.round(S.weight*S.act/10)*10}
function targets(goal){
  const G=GOALS[goal||S.goal];
  let k=Math.round(maintK()*G.kf/10)*10;
  if(G===GOALS.cut)k=Math.max(k,S.sex==="f"?1200:1500);
  return {k,p:Math.round(S.weight*G.pk),fb:Math.max(G===GOALS.cut?25:0,Math.round(k*14/1000)),ca:1000,fe:S.sex==="f"?15:10,vc:100,veg:3,fruit:2,dairy:1.5,fatR:G.fat,carbR:G.carb};
}
function recipeTags(base){
  const pd=base.p*4/base.k,ff=base.f*9/base.k,t=[];
  if(pd>=.3)t.push("高蛋白");
  if(ff<=.25)t.push("低脂");
  if(base.veg>=2)t.push("蔬菜多");
  if(base.c*4/base.k>=.5&&base.k>=520)t.push("主食足");
  return t;
}
// 模式偏好：減脂偏高蛋白低脂多蔬菜；增肌偏高蛋白、熱量與主食足
function goalScore(base){
  const pd=base.p*4/base.k,ff=base.f*9/base.k,cf=base.c*4/base.k;
  if(S.goal==="cut")return 90*(pd-.25)-60*Math.max(0,ff-.28)+12*Math.min(1,base.veg/2);
  if(S.goal==="gain")return 60*(pd-.2)+15*Math.min(1,base.k/650)+10*Math.min(1,cf/.5);
  return -20*Math.max(0,ff-.35);
}

/* ---------- 排菜單 ---------- */
function makePlan(){
  const G=GOALS[S.goal],T=targets(),P=Math.max(1,Math.round(S.people)||1);
  const stock={};
  S.inv.forEach(it=>{stock[it.key]=(stock[it.key]||0)+Math.max(0,+it.qty||0)*ING[it.key].gpu});
  const start=Object.assign({},stock);
  const prio=new Set(S.inv.filter(i=>i.prio).map(i=>i.key));
  const buy={},hist=[],days=[];
  let fromFridge=0,needTotal=0;

  function take(key,g){
    if(isPantry(key))return "pantry";
    const need=g*P,have=Math.min(stock[key]||0,need);
    if(have>0)stock[key]-=have;
    needTotal+=need;fromFridge+=have;
    if(need-have>0.5)buy[key]=(buy[key]||0)+need-have;
    return have>=need-0.5?"ok":have>0?"part":"miss";
  }
  function pickSlot(cat,exclude){
    const c=Object.keys(stock).filter(x=>ING[x].cat===cat&&stock[x]>1&&!exclude.has(x));
    c.sort((a,b)=>(prio.has(b)-prio.has(a))||(stock[b]-stock[a]));
    return c[0]||SLOT_DEFAULT[cat];
  }
  function resolve(r){
    const ex=new Set(r.items.map(x=>x[0]));
    return r.items.map(([k,g])=>{
      if(k[0]!=="@")return {key:k,g};
      const cat=k.slice(1),key=pickSlot(cat,ex);ex.add(key);
      return {key,g,slot:cat};
    });
  }
  function evalBase(items){const b=Z();for(const it of items)add(b,nut(it.key,it.key==="oil"?it.g*G.oil:it.g));return b}
  function availOf(items){
    let av=0,n=0;
    for(const it of items){if(isPantry(it.key))continue;n++;av+=Math.min(1,(stock[it.key]||0)/(it.g*P))}
    return n?av/n:1;
  }

  // 此模式的推薦菜色（依目前冰箱）
  const recs=RECIPES.map(r=>{const items=resolve(r),base=evalBase(items),avail=availOf(items);
    return {r,avail,tags:recipeTags(base),score:goalScore(base)+avail*60}}).sort((a,b)=>b.score-a.score).slice(0,8);

  const today=new Date();today.setHours(0,0,0,0);
  for(let d=0;d<7;d++){
    const date=new Date(today);date.setDate(today.getDate()+d);
    const day={date,meals:[],snacks:[],tot:Z()};
    MEALS.forEach(([m,label,share],mi)=>{
      const rnd=rng(S.seed*1009+d*31+mi*7);
      const scored=RECIPES.filter(r=>r.m.includes(m)).map(r=>{
        const items=resolve(r),base=evalBase(items),avail=availOf(items);
        let pr=0;for(const it of items)if(prio.has(it.key)&&stock[it.key]>0)pr++;
        let v=0;
        for(const h of hist)if(h.id===r.id)v-=(d-h.d<=2?70:25);
        const prev=day.meals[day.meals.length-1];
        if(prev&&prev.main===r.main)v-=20;
        const t=day.tot,gap=(key,w)=>Math.min(base[key],Math.max(0,T[key]-t[key]))/T[key]*w;
        const nb=gap("p",S.goal==="keep"?30:40)+gap("veg",20)+gap("fb",12)+gap("ca",10)+gap("fe",10)+gap("vc",8);
        return {r,items,avail,base,score:avail*100+pr*8+nb+v+goalScore(base)+rnd()*10};
      }).sort((a,b)=>b.score-a.score);

      const key=d+m,ov=S.over[key];
      const pick=(ov&&scored.find(x=>x.r.id===ov))||scored[0];
      const s=Math.min(G.scale[1],Math.max(G.scale[0],T.k*share*(S.goal==="cut"?.9:1)/pick.base.k));
      const tot=Z();
      const items=pick.items.map(it=>{
        let f=s;
        if(it.key==="oil")f=s*G.oil;
        else if(S.goal==="cut"&&VEG_CATS.includes(ING[it.key].cat))f=Math.max(1,s); // 減脂：蔬菜不縮減
        const g=roundAmt(it.key,it.g*f);
        const st=take(it.key,g);
        add(tot,nut(it.key,g));
        return Object.assign({},it,{g,st,prio:prio.has(it.key)});
      });
      add(day.tot,tot);
      day.meals.push({m,label,key,r:pick.r,main:pick.r.main,items,tot,tags:recipeTags(pick.base),override:!!(ov&&pick.r.id===ov),
        alts:scored.filter(x=>x.r.id!==pick.r.id).slice(0,6).map(x=>({id:x.r.id,n:x.r.n,avail:x.avail,tags:recipeTags(x.base)}))});
      hist.push({d,id:pick.r.id});
    });

    // 加餐：水果、乳品、蛋白質、熱量
    const t=day.tot,used=new Set();
    const snack=(key,g,why)=>{used.add(key);const st=take(key,g);add(day.tot,nut(key,g));day.snacks.push({key,g,st,why,prio:prio.has(key)})};
    const has=(k,min)=>(stock[k]||0)>=min;
    if(t.fruit<1.8){
      const k=pickSlot("fruit",new Set());
      const room=S.goal==="cut"?160:200;
      snack(k,roundAmt(k,Math.min(room,Math.max(100,(2-t.fruit)*120)),10),"水果");
    }
    const pGap=T.p-t.p;
    if(pGap>T.p*(S.goal==="keep"?.2:.08)&&(S.goal!=="cut"||t.k<T.k)){
      const opt=[["egg",55],["soymilk",300],["dried_tofu",60],["yogurt",150],["milk",240]].filter(([k])=>!used.has(k));
      const [k,g]=opt.find(([k,g])=>has(k,g*Math.max(1,S.people)))||opt[0]||["egg",55];
      const n=k==="egg"?(pGap>15&&S.goal==="gain"?2:1):1;
      snack(k,g*n,"蛋白質");
    }
    const room=()=>S.goal!=="cut"||t.k<T.k*1.01;
    if(t.dairy<1.3&&room()){
      const k=S.goal==="cut"?(["yogurt","milk"].find(x=>has(x,100))||"yogurt"):(["milk","yogurt"].find(x=>has(x,100))||"milk");
      snack(k,roundAmt(k,Math.min(S.goal==="cut"?150:240,Math.max(120,(1.5-t.dairy)*ING[k].cup)),10),"乳品");
    }
    if(S.goal==="gain"){
      if(t.k<T.k*.95)snack("nuts",roundAmt("nuts",Math.min(40,Math.max(15,(T.k-t.k)/6)),5),"熱量");
      if(t.k<T.k*.92){const k=has("toast",70)?"toast":has("sweetpotato",150)?"sweetpotato":"toast";snack(k,k==="toast"?70:150,"熱量")}
    }else if(t.k<T.k*(S.goal==="cut"?.85:.92)){
      snack("nuts",roundAmt("nuts",Math.min(30,Math.max(10,(T.k-t.k)/6)),5),"熱量");
    }
    days.push(day);
  }
  const left=Object.keys(stock).filter(k=>stock[k]>0.5).map(k=>({key:k,g:stock[k],unused:Math.abs(stock[k]-start[k])<0.5}));
  return {T,P,days,buy,left,recs,self:needTotal?fromFridge/needTotal:1,prio};
}

const WD="日一二三四五六";
const ROWS=[
  ["k","熱量","kcal"],["p","蛋白質","g"],["fatp","脂肪","占熱量"],["carbp","醣類","占熱量"],
  ["fb","膳食纖維","g"],["ca","鈣","mg"],["fe","鐵","mg"],["vc","維生素 C","mg"],
  ["veg","蔬菜","份"],["fruit","水果","份"],["dairy","乳品","杯"]
];
function pctE(t){const e=t.p*4+t.f*9+t.c*4||1;return {p:t.p*4/e*100,f:t.f*9/e*100,c:t.c*4/e*100}}
function rangeStat(v,[lo,hi]){return v>=lo&&v<=hi?"good":v>=lo-5&&v<=hi+5?"ok":v>hi?"high":"low"}
function cell(key,t,T){
  if(key==="fatp"){const v=pctE(t).f;return {txt:Math.round(v)+"%",s:rangeStat(v,T.fatR)}}
  if(key==="carbp"){const v=pctE(t).c;return {txt:Math.round(v)+"%",s:rangeStat(v,T.carbR)}}
  const r=t[key]/T[key];
  if(key==="k")return {txt:Math.round(r*100)+"%",s:r<.85?"low":r<.93?"ok":r>1.15?"high":r>1.08?"ok":"good"};
  return {txt:Math.round(r*100)+"%",s:r>=1?"good":r>=.8?"ok":"low"};
}
function tgtText(key,T){
  if(key==="fatp")return T.fatR.join("–")+"%";
  if(key==="carbp")return T.carbR.join("–")+"%";
  if(key==="dairy")return "1.5–2 杯";
  const unit={k:"kcal",p:"g",fb:"g",ca:"mg",fe:"mg",vc:"mg",veg:"份",fruit:"份"}[key];
  return (key==="veg"||key==="fruit"?"≥ ":"")+T[key].toLocaleString()+" "+unit;
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-w);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}

          <span class="tot">${Math.round(d.tot.k).toLocaleString()}<small> / ${T.k.toLocaleString()} kcal</small></span>
          <div class="macro" role="img" aria-label="蛋白質 ${Math.round(pe.p)}%、脂肪 ${Math.round(pe.f)}%、醣類 ${Math.round(pe.c)}%"><span class="mp" style="width:${pe.p}%"></span><span class="mf" style="width:${pe.f}%"></span><span class="mc" style="width:${pe.c}%"></span></div>
          <div class="mlegend"><span><i style="background:var(--tape-p)"></i>蛋白 ${Math.round(pe.p)}%</span><span><i style="background:var(--tape-y)"></i>脂肪 ${Math.round(pe.f)}%</span><span><i style="background:var(--tape-g)"></i>醣 ${Math.round(pe.c)}%</span></div>
        </div>
        <div class="flags">${low||`<span class="flag ok">主要營養素皆 ≥ 80%</span>`}</div>
      </div>
    </article>`}).join("");
}

function buyEntries(){
  const order=Object.keys(CATS);
  return Object.entries(PLAN.buy).sort((a,b)=>order.indexOf(ING[a[0]].cat)-order.indexOf(ING[b[0]].cat));
}
function renderLists(){
  const b=buyEntries();
  $("buy").innerHTML=b.length?`<ul class="list">${b.map(([k,g])=>`<li><span>${esc(ING[k].n)}</span><span class="amt">${fmtBuy(k,g)}</span></li>`).join("")}</ul>`
    :`<p class="empty">冰箱的食材就夠了，這週不用補買。</p>`;
  const L=PLAN.left.filter(l=>!isPantry(l.key));
  $("left").innerHTML=L.length?`<ul class="list">${L.map(l=>`<li><span>${esc(ING[l.key].n)}${PLAN.prio.has(l.key)?`<span class="star">優先</span>`:""}${l.unused?`<span class="star" style="color:var(--muted)">未排入</span>`:""}</span><span class="amt">${fmtAmt(l.key,l.g)}</span></li>`).join("")}</ul>`
    :`<p class="empty">一週下來冰箱食材剛好用完。</p>`;
}

function renderPlan(){
  PLAN=makePlan();
  renderModes();renderMemo();renderTiles();renderHeat();renderBoard();renderLists();
}
function renderAll(){renderSettings();renderInv();renderPlan()}
function changed(inv){if(inv)S.sample=false;save();}

/* ---------- 事件 ---------- */
$("modes").addEventListener("click",e=>{
  const b=e.target.closest("[data-goal]");if(!b||b.dataset.goal===S.goal)return;
  S.goal=b.dataset.goal;S.over={};openSlot=null;save();renderSettings();renderPlan();
  $("tab-"+S.goal).focus();
});
$("modes").addEventListener("keydown",e=>{
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const ks=Object.keys(GOALS),i=ks.indexOf(S.goal),n=ks[(i+(e.key==="ArrowRight"?1:2))%3];
  S.goal=n;S.over={};openSlot=null;save();renderSettings();renderPlan();$("tab-"+n).focus();
});
["sex","weight","act","people","staples"].forEach(id=>$(id).addEventListener("change",()=>{
  S.sex=$("sex").value;
  S.weight=Math.min(150,Math.max(30,+$("weight").value||55));
  S.act=+$("act").value;
  S.people=Math.min(10,Math.max(1,Math.round(+$("people").value)||1));
  S.staples=$("staples").checked;
  changed();renderAll();
}));

const findIng=name=>Object.values(ING).find(i=>i.n===name.trim()&&i.cat!=="fat");
$("addName").addEventListener("input",()=>{
  const name=$("addName").value.trim(),i=findIng(name);
  if(!name){$("addMeta").innerHTML=`<span class="hint">單位會依食材自動帶入</span>`;return}
  if(i){$("addMeta").innerHTML=`<span class="hint">單位：${i.u}${i.u!=="g"&&i.u!=="ml"?`（1 ${i.u} 約 ${i.gpu} g）`:""}</span>`;return}
  if(!$("addCat"))$("addMeta").innerHTML=`<select id="addCat" aria-label="自訂食材類別"><option value="leafy">葉菜類</option><option value="veg">其他蔬菜</option><option value="mush">菇類</option><option value="fruit">水果</option></select><span class="hint">自訂食材（g）</span>`;
});
$("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const name=$("addName").value.trim(),qty=+$("addQty").value;
  if(!name||!(qty>0)){(name?$("addQty"):$("addName")).focus();return}
  let i=findIng(name);
  if(!i){
    const cat=$("addCat")?$("addCat").value:"veg";
    const c={key:"c_"+Date.now().toString(36),n:name.slice(0,20),cat};
    S.custom.push(c);registerCustom(c);i=ING[c.key];
  }
  const ex=S.inv.find(x=>x.key===i.key);
  if(ex)ex.qty=+(ex.qty+qty).toFixed(2);else S.inv.push({key:i.key,qty,prio:false});
  $("addName").value="";$("addQty").value="";
  $("addMeta").innerHTML=`<span class="hint">已加入 ${esc(i.n)} ${qty} ${i.u}</span>`;
  changed(true);renderInv();renderPlan();$("addName").focus();
});
$("inv").addEventListener("change",e=>{
  const q=e.target.dataset.q;if(q==null)return;
  S.inv[+q].qty=Math.max(0,+e.target.value||0);changed(true);renderPlan();
});
$("inv").addEventListener("click",e=>{
  const p=e.target.closest("[data-prio]"),d=e.target.closest("[data-del]");
  if(p){const it=S.inv[+p.dataset.prio];it.prio=!it.prio;changed(true);renderInv();renderPlan()}
  if(d){const it=S.inv.splice(+d.dataset.del,1)[0];if(ING[it.key].custom)S.custom=S.custom.filter(c=>c.key!==it.key);changed(true);renderInv();renderPlan()}
});
$("loadSample").addEventListener("click",()=>{
  const s=sample();S.inv=s.inv;S.sample=true;S.over={};save();renderAll();
});
let clearArmed=false;
$("clearInv").addEventListener("click",()=>{
  if(!clearArmed){clearArmed=true;$("clearInv").textContent="再按一次確認清空";setTimeout(()=>{clearArmed=false;$("clearInv").textContent="清空冰箱"},3000);return}
  clearArmed=false;$("clearInv").textContent="清空冰箱";
  S.inv=[];S.custom=[];S.over={};changed(true);renderAll();
});
$("reroll").addEventListener("click",()=>{S.seed=(S.seed*7+13)%100003;S.over={};openSlot=null;save();renderPlan()});
$("board").addEventListener("click",e=>{
  const a=e.target.closest("[data-alt]"),p=e.target.closest("[data-pick]");
  if(p){
    // 固定目前其他餐，只換這一餐
    PLAN.days.forEach(d=>d.meals.forEach(m=>{S.over[m.key]=m.r.id}));
    S.over[p.dataset.pick]=p.dataset.id;openSlot=null;save();renderPlan();return;
  }
  if(a){openSlot=openSlot===a.dataset.alt?null:a.dataset.alt;renderBoard()}
});
$("copyBuy").addEventListener("click",()=>{
  const txt="購物清單\n"+buyEntries().map(([k,g])=>"□ "+ING[k].n+" "+fmtBuy(k,g)).join("\n");
  const btn=$("copyBuy");
  const fallback=()=>{
    let ta=document.querySelector("textarea.copybox");
    if(!ta){ta=document.createElement("textarea");ta.className="copybox";ta.readOnly=true;ta.id="copybox";$("buy").appendChild(ta)}
    ta.value=txt;ta.select();btn.textContent="請手動複製";
  };
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent="已複製";setTimeout(()=>btn.textContent="複製清單",1800)},fallback)}catch(err){fallback()}
});

renderAll();
})();
</script>
</body>
</html>
